[project]
name = "msflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.9"
dependencies = [
  "torchaudio==2.6.0",
  "tensorboard>=2.20.0",
  "einops>=0.8.1",
  "diffusers==0.31.0",
  "transformers>=4.57.0",
  "torchdiffeq>=0.2.5",
  "pip>=25.2",
  "clip",
  "en-core-web-sm",
  "matplotlib==3.3.2",
  "numpy==1.26.4",
  "packaging>=25.0",
  "ninja>=1.13.0",
  "timm>=1.0.20",
  "lmdb>=1.7.3",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.2",
  "opencv-python>=4.11.0.86",
  "wandb>=0.22.2",
  "easydict>=1.13",
  "huggingface-hub[cli]>=0.35.3",
  "accelerate>=1.11.0",
  "matplotlib-inline==0.1.6",
  "ipykernel>=7.0.1",
  "flash-attn==2.7.3",
  "tiktoken>=0.12.0",
  "sentencepiece==0.2.0",
  "pysen[lint]>=0.11.0",
  "torch",
  "torchvision",
  "imageio>=2.37.4",
  "sentence-transformers>=5.7.0",
  "pytorch-lightning>=2.6.5",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
clip = { git = "https://github.com/openai/CLIP.git" }
torch = { url = "https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp310-cp310-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu124/torchvision-0.21.0%2Bcu124-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pysen]
version = "0.11"

[tool.pysen.lint]
enable_black = true
enable_flake8 = true
enable_isort = true
enable_mypy = true
mypy_preset = "strict"
line_length = 88
py_version = "py310"
[[tool.pysen.lint.mypy_targets]]
  paths = ["."]
